

name: Docs CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

 
  build-and-push-image:
    name: Construir y publicar imagen Docker
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/elohim-docs:latest
            ghcr.io/${{ github.repository_owner }}/elohim-docs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  bump-main-repo:
    name: Actualizar puntero de submódulo en el repo principal
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Disparar despliegue en el repo principal
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MAIN_REPO_PAT }}
          repository: angc-labs/CC3090-inversiones-elohim-solution
          event-type: submodule-updated
          client-payload: '{"submodule": "docs", "sha": "${{ github.sha }}"}'
